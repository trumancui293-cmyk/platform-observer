function h(tag, props, ...children) {
  const node = document.createElement(tag);
  Object.entries(props || {}).forEach(([key, value]) => {
    if (value == null || value === false) return;
    if (key === "class") node.className = value;
    else if (key === "style") node.setAttribute("style", value);
    else if (key.startsWith("on") && typeof value === "function") node.addEventListener(key.slice(2).toLowerCase(), value);
    else if (key === "value" && "value" in node) node.value = value;
    else if (typeof value === "boolean") node[key] = value;
    else node.setAttribute(key, value === true ? "" : String(value));
  });
  children.flat().forEach((child) => {
    if (child == null || child === false) return;
    node.append(child.nodeType ? child : document.createTextNode(String(child)));
  });
  return node;
}

function table(headers, rows, numeric) {
  const numericSet = new Set(numeric || []);
  return h("div", { class: "table-wrap" },
    h("table", {},
      h("thead", {}, h("tr", {}, ...headers.map((header, index) => h("th", { class: numericSet.has(index) ? "num" : "" }, header)))),
      h("tbody", {}, ...rows.map((row) => h("tr", {}, ...row.map((cell, index) => h("td", { class: numericSet.has(index) ? "num" : "" }, cell)))))
    )
  );
}

function mean(list, key) {
  const total = list.reduce((sum, item) => sum + item.scores[key], 0);
  return Math.round((total / list.length) * 10) / 10;
}

function fmt(value) { return value.toFixed(1); }

function topNames(list, key) {
  const max = Math.max(...list.map((item) => item.scores[key]));
  return list.filter((item) => item.scores[key] === max).map((item) => item.name).join("、");
}

      markChips(containerId, attr, value);
    }
  }, label);
}

function filteredPlatforms() {
  const keyword = state.query.trim().toLowerCase();
  return PLATFORMS.filter((item) => {
    if (state.region !== "all" && item.region !== state.region) return false;
    if (state.family !== "all" && item.family !== state.family) return false;
    if (!keyword) return true;
    return (item.name + " " + item.type + " " + item.blurb + " " + item.audience + " " + item.forms).toLowerCase().includes(keyword);
  });
}

function scoreLine(platform) {
  const entries = SCORE_KEYS.map((key) => ({ label: SCORE_LABEL[key], value: platform.scores[key] }));
  const max = Math.max(...entries.map((item) => item.value));
  const min = Math.min(...entries.map((item) => item.value));
  const high = entries.filter((item) => item.value === max).map((item) => item.label).join("、");
  const low = entries.filter((item) => item.value === min).map((item) => item.label).join("、");
  const reading = max === min ? "五项接近，按具体选题再决定它承担哪一段。" : "优先用它做" + high + "。" + low + "不是它的主任务。";
    return h("div", {},
    ...entries.map((item) => h("div", { class: "cmp single" },
      h("div", { class: "cmp-label" }, item.label),
      h("div", { class: "cmp-track" }, h("span", { class: "rail" }, h("i", { class: "a", style: "width:" + (item.value / 5 * 100) + "%" })), h("b", {}, String(item.value)))
    )),
    h("p", { class: "caption" }, "条的长度是 1–5 分的结构适配度。" + SOURCE),
    h("p", {}, reading)
  );
}

function detailOf(platform) {
  return h("div", {},
    h("h2", {}, platform.name),
    h("p", {}, h("strong", {}, platform.blurb)),
    h("p", { class: "caption" }, platform.region + " · " + platform.type + " · 分发靠" + platform.graph + " · 对照 " + platform.peer),
    h("h3", {}, platform.name + "的五维结构适配度"),
    scoreLine(platform),
    h("div", { class: "grid-2" },
      h("div", { class: "block" }, h("h3", {}, "受众画像"), h("p", {}, platform.audience), h("p", {}, platform.age + platform.geo)),
      h("div", { class: "block" }, h("h3", {}, "用户调研"), h("p", {}, "任务：" + platform.job), h("p", {}, "信任：" + platform.trust), h("p", {}, "痛点：" + platform.pain)),
      h("div", { class: "block" }, h("h3", {}, "内容类型与热点"), h("p", {}, "原生形态：" + platform.forms), h("p", {}, "正在看的趋势：" + platform.trend), h("p", {}, "本周可执行的观察：" + platform.watch)),
      h("div", { class: "block" }, h("h3", {}, "变现、创作者与指标"), h("p", {}, "商业化：" + platform.money), h("p", {}, "创作者：" + platform.creator), h("p", {}, "指标：" + platform.kpi), h("p", {}, "节奏：" + platform.cadence))
    ),
    h("div", { class: "toolbar" },
      h("button", { class: "primary", type: "button", onClick: () => openSpecs(platform.id) }, "查看内容要求"),
      h("span", { class: "caption" }, "可以沿用：" + platform.keep + " 必须重做：" + platform.redo)
    )
  );
}

function drawPlatforms() {
  const list = filteredPlatforms();
  const count = document.getElementById("platform-count");
  if (count) count.textContent = list.length + " 个平台";
  const current = list.find((item) => item.id === state.selected) || list[0];
  const results = document.getElementById("platform-results");
  const detail = document.getElementById("platform-detail");
  if (!results || !detail) return;
  if (!current) {
    results.replaceChildren(h("div", { class: "note warn" }, "没有匹配的平台。换一个类型，或清空搜索词。"));
    detail.replaceChildren();
    return;
  }
  results.replaceChildren(
    table(["平台", "区域", "类型", "分发", "种草", "搜索", "热点"], list.map((item) => [
      h("button", { class: "text-btn", type: "button", onClick: () => { state.selected = item.id; drawPlatforms(); } }, item.id === current.id ? item.name + "（当前）" : item.name),
      item.region,
      item.family,
      item.graph,
      String(item.scores.seed),
      String(item.scores.search),
      String(item.scores.velocity)
    ]), [4, 5, 6]),
    h("p", { class: "caption" }, "种草、搜索、热点三列是 1–5 分。点平台名阅读受众、调研和经营方式。")
  );
  detail.replaceChildren(detailOf(current));
}

  const search = h("input", { id: "q", type: "search", placeholder: "搜平台、受众或内容形态", value: state.query });

}

function rankedPlatforms() {
  const job = JOBS.find((item) => item.id === state.job) || JOBS[0];
  return {
    job,
    list: PLATFORMS.filter((item) => state.jobRegion === "all" || item.region === state.jobRegion)
      .map((platform, index) => ({ platform, index }))
      .sort((a, b) => b.platform.scores[job.key] - a.platform.scores[job.key] || a.index - b.index)
      .map((item) => item.platform)
  };
}

function drawJobs() {
  const box = document.getElementById("job-results");
  if (!box) return;
  const ranked = rankedPlatforms();
  const lead = ranked.list[0];
  box.replaceChildren(
    lead ? h("div", { class: "note" }, h("strong", {}, "优先样本：" + lead.name + "。"), lead.blurb + ranked.job.hint) : h("div", { class: "note warn" }, "当前区域没有平台。"),
    table(["排序", "平台", "区域", SCORE_LABEL[ranked.job.key], "用户在这里的任务"], ranked.list.map((item, index) => [
      String(index + 1), item.name, item.region, String(item.scores[ranked.job.key]), item.job
    ]), [0, 3]),
    h("p", { class: "caption" }, "按「" + SCORE_LABEL[ranked.job.key] + "」从高到低排列，分数是 1–5 的结构适配度。" + SOURCE)

}

function trendsPanel() {
  return h("div", {},
    h("h2", {}, "十条趋势各自改写多少个平台"),
    ...TRENDS.map((item) => h("div", { class: "cmp single" },
      h("div", { class: "cmp-label" }, item.short),
      h("div", { class: "cmp-track" },
        h("span", { class: "rail" }, h("i", { class: "a", style: "width:" + (item.platformIds.length / 16 * 100) + "%" })),
        h("b", {}, String(item.platformIds.length))
      )
    )),
    h("p", { class: "caption" }, "条的长度是这条趋势会直接改变内容做法的平台个数，样本共 16 个。这不是热度指数。" + SOURCE),
    table(["趋势", "阶段", "主场平台", "内容上要改", "观测信号"], TRENDS.map((item) => [
      item.name, item.stage, item.platformIds.map(platformName).join("、"), item.ask, item.signal
    ]))
  );
}

function shownPlatforms() {
  return state.spec === "all" ? PLATFORMS : PLATFORMS.filter((item) => item.id === state.spec);
}

function drawSpecs() {
  const make = document.getElementById("spec-make");
  const rules = document.getElementById("spec-rules");
  const move = document.getElementById("spec-move");
  if (!make || !rules || !move) return;
  const shown = shownPlatforms();
  make.replaceChildren(table(["平台", "区域", "时长与画幅", "开头", "封面与标题", "正文结构"], shown.map((item) => [item.name, item.region, item.duration, item.hook, item.cover, item.copy])));
  rules.replaceChildren(table(["平台", "行动号召", "不像原生的做法", "合规底线"], shown.map((item) => [item.name, item.cta, item.ban, item.compliance])), h("p", { class: "caption" }, "规范是发布前清单。" + SOURCE + " 小红书还需另做商业用语和功效承诺检查。"));
  move.replaceChildren(table(["平台", "对照", "可以沿用", "必须重做"], shown.map((item) => [item.name, item.peer, item.keep, item.redo])));
}

function openSpecs(id) {
  state.spec = id;
  const select = document.getElementById("spec");
  if (select) select.value = id;
  drawSpecs();
  activate("specs");
}

function specsPanel() {
  const select = h("select", { id: "spec" },
    h("option", { value: "all" }, "全部平台"),
    ...PLATFORMS.map((item) => h("option", { value: item.id }, item.name + " · " + item.region))
  );
  select.addEventListener("change", () => { state.spec = select.value; drawSpecs(); });
  return h("div", {},
    h("h2", {}, "制作规范"),
    h("p", {}, "内容要求按平台原生习惯写。先选平台，再核对开头、封面、正文和边界。"),
    select,
    h("div", { id: "spec-make" }),
    h("h2", {}, "号召、禁忌与合规"),
    h("div", { id: "spec-rules" }),
    h("h2", {}, "跨平台迁移"),
    h("div", { id: "spec-move" }),
    h("div", { class: "note warn" }, "迁移时保留的是结构：钩子、证据顺序和系列关系。语言、音乐、梗、封面文字、披露方式和货架是否存在，都要按目标平台重做。")
  );
}

function loadJson(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key) || ""); }
  catch (error) { return fallback; }
}

function drawNotes() {
  const box = document.getElementById("note-list");
  if (!box) return;
  const notes = loadJson("obs-notes", []);
  if (!notes.length) {
    box.replaceChildren();
    return;
  }
  box.replaceChildren(
    h("h2", {}, "已记录 " + notes.length + " 条"),
    table(["日期", "平台", "类型", "热度", "观察", ""], notes.map((item) => [
      item.date,
      platformName(item.platformId),
      item.lens,
      item.heat,
      item.topic + "：" + item.body,
      h("button", { class: "text-btn", type: "button", onClick: () => {
        const next = loadJson("obs-notes", []).filter((note) => note.id !== item.id);
        localStorage.setItem("obs-notes", JSON.stringify(next));
        drawNotes();
      } }, "删除")
    ]))
  );
}

function updateCheckCount() {
  const target = document.getElementById("check-count");
  if (!target) return;
  const checks = loadJson("obs-checks", {});
  const done = WEEKLY.filter((item) => checks[item.id]).length;
  target.textContent = "已完成 " + done + "/5。勾选保存在这台浏览器里。";
}

function logPanel() {
  const checks = loadJson("obs-checks", {});
  const date = h("input", { type: "text", value: "2026-11-02" });
  const platform = h("select", {}, ...PLATFORMS.map((item) => h("option", { value: item.id }, item.name)));
  platform.value = "xhs";
  const lens = h("select", {}, ...["热点形态", "受众原话", "内容缺口", "规则变化", "竞品打法"].map((item) => h("option", { value: item }, item)));
  const heat = h("select", {}, ...["上升", "平稳", "退潮"].map((item) => h("option", { value: item }, item)));
  const topic = h("input", { type: "text", placeholder: "选题或现象，一句话" });
  const body = h("textarea", { placeholder: "写下看到的原话、形态，或规则具体变了什么" });
  return h("div", {},
    h("h2", {}, "本周固定动作"),
    h("p", { id: "check-count", class: "caption" }, ""),
    ...WEEKLY.map((item) => {
      const input = h("input", { type: "checkbox" });
      input.checked = Boolean(checks[item.id]);
      input.addEventListener("change", () => {
        const next = loadJson("obs-checks", {});
        next[item.id] = input.checked;
        localStorage.setItem("obs-checks", JSON.stringify(next));
        updateCheckCount();
      });
      return h("label", { class: "check" }, input, item.label);
    }),
    h("button", { class: "text-btn", type: "button", onClick: () => {
      localStorage.setItem("obs-checks", "{}");
      document.querySelectorAll("#log input[type=checkbox]").forEach((input) => { input.checked = false; });
      updateCheckCount();
    } }, "清除本周勾选"),
    h("h2", {}, "记一条观察"),
    h("div", { class: "form-grid" }, date, platform, lens, heat),
    topic,
    body,
    h("div", { class: "toolbar" }, h("button", { class: "primary", type: "button", onClick: () => {
      if (!topic.value.trim() || !body.value.trim()) return;
      const notes = loadJson("obs-notes", []);
      notes.unshift({
        id: Date.now().toString(36),
        date: date.value.trim() || "2026-11-02",
        platformId: platform.value,
        lens: lens.value,
        heat: heat.value,
        topic: topic.value.trim(),
        body: body.value.trim()
      });
      localStorage.setItem("obs-notes", JSON.stringify(notes));
      topic.value = "";
      body.value = "";
      drawNotes();
    } }, "记下这条")),
    h("p", { class: "caption" }, "记录保存在这台浏览器里，换一台电脑不会跟着走。"),
    h("div", { id: "note-list" })
  );
}

function activate(id) {
  const known = TABS.some((item) => item.id === id);
  const next = known ? id : "overview";
  document.querySelectorAll(".tab").forEach((button) => button.classList.toggle("active", button.dataset.tab === next));
  document.querySelectorAll(".panel").forEach((section) => { section.hidden = section.id !== next; });
  if (location.hash !== "#" + next) history.replaceState(null, "", "#" + next);
}

function init() {
  const nav = document.getElementById("nav");
  TABS.forEach((tab) => {
    nav.append(h("button", { class: "tab", type: "button", "data-tab": tab.id, onClick: () => activate(tab.id) }, tab.label));
  });
  document.getElementById("main").append(
    panel("overview", overview()),
    panel("platforms", platformsPanel()),
    panel("audience", audiencePanel()),
    panel("trends", trendsPanel()),
    panel("specs", specsPanel()),
    panel("log", logPanel())
  );
  drawPlatforms();
  drawJobs();
  drawSpecs();
  drawNotes();
  updateCheckCount();
  const hash = location.hash.replace("#", "");
  activate(hash || "overview");
  document.getElementById("copy").addEventListener("click", async () => {
    const url = location.href.split("#")[0];
    try { await navigator.clipboard.writeText(url); }
    catch (error) { window.prompt("复制这个链接", url); return; }
    const flash = document.getElementById("flash");
    flash.textContent = "链接已复制";
    setTimeout(() => { flash.textContent = ""; }, 1600);
  });
}

init();
